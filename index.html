.vf-eco{font-size:13px;color:var(--verde-cl);font-family:'DM Mono',monospace;font-weight:600;margin-top:4px}

/* ─── CTA MID ────────────────────────────────────── */
.cta-mid{
  background:linear-gradient(135deg,#08111E 0%,#0F1E35 50%,#08111E 100%);
  border-top:1px solid var(--borda);border-bottom:1px solid var(--borda);
  padding:80px 0;text-align:center;
}
.cta-mid h2{
  font-family:'Playfair Display',serif;font-size:clamp(28px,4vw,48px);
  font-weight:900;line-height:1.1;margin-bottom:12px;
}
.cta-mid p{font-size:17px;color:var(--txt2);max-width:560px;margin:0 auto 36px;line-height:1.7}

/* ─── PARA QUEM ──────────────────────────────────── */
.pq-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--borda);border-radius:12px;overflow:hidden;margin-top:52px}
@media(max-width:600px){.pq-grid{grid-template-columns:1fr}}
.pq-card{background:var(--card2);padding:36px 32px}
.pq-card h4{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;margin-bottom:20px}
.pq-sim h4{color:var(--verde-cl)}
